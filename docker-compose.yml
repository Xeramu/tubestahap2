version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb

    ports:
      - "3306:3306"

    command: --default-authentication-plugin=mysql_native_password

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 40s

  user-service:
    build:
      context: ./user-service

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: appdb

  order-service:
    build:
      context: ./order-service

    ports:
      - "8083:8083"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: appdb
